name = s60Klatt
summary = "S60 Klatt: independent historical S60 TTS recreation"
description = "Independent experimental Klatt-style synthesizer intended to recreate the pronunciation behaviour, prosody and acoustic character of historical Nokia S60 TTS systems through newly written code and independently defined voice profiles. It contains no phone firmware, ROM pages, translated object code, voice snapshots or extracted speech data. This project is not affiliated with or endorsed by Nokia."
author = "NOKIATTSNVDA contributors"
