name = s60Klatt
summary = "S60 Klatt: independent 5320 speech reconstruction"
description = "Independent experimental Klatt-style synthesizer intended to recreate the pronunciation behaviour, prosody and acoustic character of historical Nokia S60 TTS systems through newly written code and output-only measurements. Clean test 3 probe 1 begins with observed German 5320 punctuation behavior; its acoustic core is not yet a recognizable match. It contains no phone firmware, ROM pages, translated object code, voice snapshots or extracted speech data. This project is not affiliated with or endorsed by Nokia."
author = "NOKIATTSNVDA contributors"
url = https://github.com/hozosch/S60Klatt
version = 0.3.0-clean-test3-probe1
minimumNVDAVersion = 2025.1
lastTestedNVDAVersion = 2026.3
updateChannel = None
