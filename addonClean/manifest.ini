name = s60Klatt
summary = "S60 Klatt: independent 5320 speech reconstruction"
description = "Independent experimental Klatt-style synthesizer intended to recreate the pronunciation behaviour, prosody and acoustic character of historical Nokia S60 TTS systems through newly written code and output-only measurements. Clean test 3 probe 2 adds measured German 5320 word-level intonation and vowel spectral balance without adding start latency; its acoustic core remains experimental. It contains no phone firmware, ROM pages, translated object code, voice snapshots or extracted speech data. This project is not affiliated with or endorsed by Nokia."
author = "NOKIATTSNVDA contributors"
url = https://github.com/hozosch/S60Klatt
version = 0.3.0-clean-test3-probe2
