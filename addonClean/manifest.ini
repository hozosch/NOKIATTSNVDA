name = s60Klatt
summary = "S60 Klatt: independent 5320 speech reconstruction"
description = "Independent experimental Klatt-style synthesizer intended to recreate the pronunciation behaviour, prosody and acoustic character of historical Nokia S60 TTS systems through newly written code and independently measured voice profiles. Clean test 2 targets the German 5320 male and female voices. It contains no phone firmware, ROM pages, translated object code, voice snapshots or extracted speech data. This project is not affiliated with or endorsed by Nokia."
author = "NOKIATTSNVDA contributors"
url = https://github.com/hozosch/S60Klatt
version = 0.2.0-clean-test2
minimumNVDAVersion = 2025.1
lastTestedNVDAVersion = 2026.3
