name = s60Klatt
summary = "S60 Klatt: independent 5320 speech reconstruction"
description = "Independent experimental formant synthesizer intended to recreate the pronunciation behaviour, prosody and acoustic character of historical Nokia S60 TTS systems through newly written code and output-only measurements. Clean test 6 is fitted against 28 controlled German phone probes, adds periodic closure for voiced stops and corrects intervocalic s without adding start latency. It contains no phone firmware, ROM pages, translated object code, voice snapshots or extracted speech data. It contains no DECtalk code or data. This project is not affiliated with or endorsed by Nokia."
author = "NOKIATTSNVDA contributors"
url = https://github.com/hozosch/S60Klatt
version = 0.6.0-clean-test6
minimumNVDAVersion = 2025.1
lastTestedNVDAVersion = 2026.3
