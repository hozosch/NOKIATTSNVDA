name = s60Klatt
summary = "S60 Klatt: independent 5320 speech reconstruction"
description = "Independent experimental Klatt-style synthesizer intended to recreate the pronunciation behaviour, prosody and acoustic character of historical Nokia S60 TTS systems through newly written code and output-only measurements. Clean test 4 adds an output-fitted German 5320 male acoustic profile, phrase plateau with final fall, and shorter stop closures without adding start latency; its acoustic core remains experimental. It contains no phone firmware, ROM pages, translated object code, voice snapshots or extracted speech data. This project is not affiliated with or endorsed by Nokia."
author = "NOKIATTSNVDA contributors"
url = https://github.com/hozosch/S60Klatt
version = 0.4.0-clean-test4
minimumNVDAVersion = 2025.1
lastTestedNVDAVersion = 2026.3
