name: Build independent Classic Klatt NVDA test add-on

on:
  workflow_dispatch:
  push:
    branches:
      - codex/clean-klatt-test1

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and test the independent synthesis core
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            native/clean/classic_klatt.c \
            tests/classic_klatt_core_test.c \
            -lm -o /tmp/classic_klatt_core_test
          /tmp/classic_klatt_core_test
      - name: Test and compile-check the NVDA driver
        run: |
          python -m unittest tests.test_classic_klatt_driver
          python -m py_compile addonClean/synthDrivers/classicKlatt.py
      - name: Verify the clean add-on source boundary
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem addonClean -Recurse -File | Where-Object {
            $_.Extension -in @('.rom', '.nrp', '.ncf', '.snapshot') -or
            $_.Name -like 'nokia_runtime*'
          }
          if ($forbidden) {
            throw "Firmware-derived payload reached addonClean: $($forbidden.FullName -join ', ')"
          }

  desktop-runtimes:
    needs: source-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.arch }} runtime
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force build/runtime | Out-Null
          cl /nologo /std:c11 /O2 /W4 /WX /LD native/clean/classic_klatt.c `
            /link /OPT:REF /OPT:ICF "/OUT:build/runtime/classic_klatt_${{ matrix.arch }}.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt runtime build failed' }
          cl /nologo /std:c11 /O2 /W4 /WX `
            native/clean/classic_klatt.c tests/classic_klatt_core_test.c `
            "/Fe:build/runtime/classic_klatt_test_${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt native test build failed' }
          & "build/runtime/classic_klatt_test_${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt native test failed' }
          $exports = dumpbin /exports "build/runtime/classic_klatt_${{ matrix.arch }}.dll"
          if ($LASTEXITCODE -ne 0 -or $exports -notmatch 'classic_klatt_speak_utf16') {
            throw 'Classic Klatt synthesis export is missing'
          }
      - uses: actions/upload-artifact@v6
        with:
          name: classic-klatt-${{ matrix.arch }}
          path: build/runtime/classic_klatt_${{ matrix.arch }}.dll
          if-no-files-found: error

  arm-runtimes:
    needs: source-tests
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build ARM64EC and pure ARM64 runtimes
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch arm64
          New-Item -ItemType Directory -Force build/runtime | Out-Null
          cl /nologo /std:c11 /arm64EC /O2 /W4 /WX /LD native/clean/classic_klatt.c `
            /link /MACHINE:ARM64EC /OPT:REF /OPT:ICF "/OUT:build/runtime/classic_klatt_arm64ec.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt ARM64EC runtime build failed' }
          cl /nologo /std:c11 /O2 /W4 /WX /LD native/clean/classic_klatt.c `
            /link /MACHINE:ARM64 /OPT:REF /OPT:ICF "/OUT:build/runtime/classic_klatt_arm64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt ARM64 runtime build failed' }
          cl /nologo /std:c11 /O2 /W4 /WX `
            native/clean/classic_klatt.c tests/classic_klatt_core_test.c `
            "/Fe:build/runtime/classic_klatt_test_arm64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt ARM64 test build failed' }
          & build/runtime/classic_klatt_test_arm64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Classic Klatt ARM64 test failed' }

          $arm64ec = [IO.File]::ReadAllBytes('build/runtime/classic_klatt_arm64ec.dll')
          $arm64ecOffset = [BitConverter]::ToInt32($arm64ec, 0x3c)
          $arm64ecMachine = [BitConverter]::ToUInt16($arm64ec, $arm64ecOffset + 4)
          if ($arm64ecMachine -notin @(0x8664, 0xA641, 0xA64E)) {
            throw "Unexpected ARM64EC machine 0x$($arm64ecMachine.ToString('X4'))"
          }
          $arm64 = [IO.File]::ReadAllBytes('build/runtime/classic_klatt_arm64.dll')
          $arm64Offset = [BitConverter]::ToInt32($arm64, 0x3c)
          $arm64Machine = [BitConverter]::ToUInt16($arm64, $arm64Offset + 4)
          if ($arm64Machine -ne 0xAA64) {
            throw "Unexpected ARM64 machine 0x$($arm64Machine.ToString('X4'))"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: classic-klatt-arm
          path: build/runtime/classic_klatt_arm*.dll
          if-no-files-found: error

  package:
    needs: [desktop-runtimes, arm-runtimes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: classic-klatt-x86
          path: build/download/x86
      - uses: actions/download-artifact@v7
        with:
          name: classic-klatt-x64
          path: build/download/x64
      - uses: actions/download-artifact@v7
        with:
          name: classic-klatt-arm
          path: build/download/arm
      - name: Assemble independent NVDA add-on
        shell: pwsh
        run: |
          $stage = 'build/classic-addon'
          New-Item -ItemType Directory -Force `
            "$stage/synthDrivers", "$stage/bin/x86", "$stage/bin/x64", "$stage/bin/arm64ec" | Out-Null
          Copy-Item addonClean/manifest.ini "$stage/manifest.ini"
          Copy-Item addonClean/synthDrivers/classicKlatt.py "$stage/synthDrivers/classicKlatt.py"
          Copy-Item build/download/x86/classic_klatt_x86.dll "$stage/bin/x86/"
          Copy-Item build/download/x64/classic_klatt_x64.dll "$stage/bin/x64/"
          Copy-Item build/download/arm/classic_klatt_arm64ec.dll "$stage/bin/arm64ec/"

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Extension -in @('.rom', '.nrp', '.ncf', '.snapshot') -or
            $_.Name -like 'nokia_runtime*'
          }
          if ($forbidden) {
            throw "Forbidden firmware-derived package content: $($forbidden.FullName -join ', ')"
          }
          if ((Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum -gt 2MB) {
            throw 'Independent prototype package unexpectedly exceeds 2 MiB'
          }
          Compress-Archive -Path "$stage/*" -DestinationPath build/classicKlatt-0.1.0-clean-test1.zip -Force
          Move-Item build/classicKlatt-0.1.0-clean-test1.zip build/classicKlatt-0.1.0-clean-test1.nvda-addon
          Get-Item build/classicKlatt-0.1.0-clean-test1.nvda-addon | Format-List Name,Length
      - uses: actions/upload-artifact@v6
        with:
          name: classicKlatt-0.1.0-clean-test1
          path: build/classicKlatt-0.1.0-clean-test1.nvda-addon
          if-no-files-found: error
