name: Build experimental native Nokia 5320 NVDA add-on

on:
  workflow_dispatch:
  push:
    paths:
      - "addon/synthDrivers/**"
      - ".github/scripts/enter-msvc.ps1"
      - ".github/scripts/instrument_runtime_lifecycle.py"
      - "tools/patch_5320_klatt_normalization_loop.py"
      - ".github/workflows/build-nvda-addon-5320.yml"

permissions:
  actions: read
  contents: read

jobs:
  arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen Test 18 firmware and configuration
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Extract frozen Test 18 data
        shell: bash
        run: |
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon
      - uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/full-aot
          repository: hozosch/NOKIATTSNVDA
          run-id: 33599463624
          github-token: ${{ github.token }}
      - name: Build current ARM64 and ARM64EC runtimes
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch arm64
          New-Item -ItemType Directory -Force native/generated/full, build/native-arm64, build/native-arm64ec | Out-Null
          Get-ChildItem -Recurse build/full-aot -Filter "nokia_frontend_5320_full*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/full/ -Force
          }
          gzip -dk native/generated/nokia_klatt_5320.c.gz
          python tools/patch_5320_klatt_normalization_loop.py native/generated/nokia_klatt_5320.c
          if ($LASTEXITCODE -ne 0) { throw 'Klatt loop repair failed' }
          python .github/scripts/instrument_runtime_lifecycle.py native/nokia_runtime.c
          if ($LASTEXITCODE -ne 0) { throw 'runtime instrumentation failed' }
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /arm64EC /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /MACHINE:ARM64EC /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-arm64ec/nokia_runtime_5320_arm64ec.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64EC runtime link failed' }
          $dllBytes = [IO.File]::ReadAllBytes('build/native-arm64ec/nokia_runtime_5320_arm64ec.dll')
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          if ($machine -notin @(0x8664, 0xA641, 0xA64E)) { throw "runtime machine is 0x$($machine.ToString('X4')), not ARM64EC-compatible" }
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /MACHINE:ARM64 /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-arm64/nokia_runtime_5320_arm64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 runtime link failed' }
          $dllBytes = [IO.File]::ReadAllBytes('build/native-arm64/nokia_runtime_5320_arm64.dll')
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw "runtime machine is 0x$($machine.ToString('X4')), not ARM64" }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Smoke-test ARM64EC synthesis
        shell: bash
        run: |
          snapshot=$(find build/full-aot -name '5320-de-male.snapshot' -print -quit)
          python tools/smoke_native_5320_runtime.py \
            build/native-arm64ec/nokia_runtime_5320_arm64ec.dll \
            build/test18-addon/data/SYM.ROM \
            "$snapshot" \
            build/test18-addon/data/config
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Smoke-test ARM64 synthesis
        shell: bash
        run: |
          snapshot=$(find build/full-aot -name '5320-de-male.snapshot' -print -quit)
          python tools/smoke_native_5320_runtime.py \
            build/native-arm64/nokia_runtime_5320_arm64.dll \
            build/test18-addon/data/SYM.ROM \
            "$snapshot" \
            build/test18-addon/data/config
      - uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-arm64ec-current
          path: build/native-arm64ec/nokia_runtime_5320_arm64ec.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-arm64-current
          path: build/native-arm64/nokia_runtime_5320_arm64.dll
          if-no-files-found: error

  package:
    needs: arm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen Test 18 firmware and configuration
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Extract frozen Test 18 data
        shell: bash
        run: |
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon

      - name: Download closed Run 51 native sources
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/full-aot
          repository: hozosch/NOKIATTSNVDA
          run-id: 33599463624
          github-token: ${{ github.token }}

      - name: Download current ARM64EC runtime
        uses: actions/download-artifact@v7
        with:
          name: nokia-runtime-5320-arm64ec-current
          path: build/runtime-arm64ec

      - name: Download current ARM64 runtime
        uses: actions/download-artifact@v7
        with:
          name: nokia-runtime-5320-arm64-current
          path: build/runtime-arm64

      - name: Build native x86 runtime for 32-bit NVDA
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch x86
          New-Item -ItemType Directory -Force native/generated/full, build/native-x86 | Out-Null
          Get-ChildItem -Recurse build/full-aot -Filter "nokia_frontend_5320_full*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/full/ -Force
          }
          gzip -dk native/generated/nokia_klatt_5320.c.gz
          python tools/patch_5320_klatt_normalization_loop.py native/generated/nokia_klatt_5320.c
          if ($LASTEXITCODE -ne 0) { throw 'Klatt loop repair failed' }
          python .github/scripts/instrument_runtime_lifecycle.py native/nokia_runtime.c
          if ($LASTEXITCODE -ne 0) { throw 'runtime instrumentation failed' }
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-x86/nokia_runtime_5320_x86.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native x86 runtime link failed' }
          $headers = dumpbin /headers build/native-x86/nokia_runtime_5320_x86.dll
          if (($headers -join "`n") -notmatch '14C machine \(x86\)') { throw 'runtime is not x86' }

      - name: Build current native x64 runtime
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch x64
          New-Item -ItemType Directory -Force build/native-x64 | Out-Null
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-x64/nokia_runtime_5320_x64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native x64 runtime link failed' }
          $headers = dumpbin /headers build/native-x64/nokia_runtime_5320_x64.dll
          if (($headers -join "`n") -notmatch '8664 machine \(x64\)') { throw 'runtime is not x64' }

      - name: Smoke-test x64 synthesis
        shell: bash
        run: |
          snapshot=$(find build/full-aot -name '5320-de-male.snapshot' -print -quit)
          python tools/smoke_native_5320_runtime.py \
            build/native-x64/nokia_runtime_5320_x64.dll \
            build/test18-addon/data/SYM.ROM \
            "$snapshot" \
            build/test18-addon/data/config

      - name: Assemble NVDA add-on
        shell: pwsh
        run: |
          $stage = 'build/addon'
          New-Item -ItemType Directory -Force "$stage/bin/x86", "$stage/bin/x64", "$stage/bin/arm64", "$stage/bin/arm64ec", "$stage/data/config", "$stage/synthDrivers" | Out-Null
          Copy-Item addon/manifest.ini "$stage/manifest.ini"
          (Get-Content "$stage/manifest.ini" -Raw) -replace '(?m)^version\s*=.*$', 'version = 0.1.0-test29' | Set-Content "$stage/manifest.ini" -Encoding utf8
          Copy-Item addon/synthDrivers/nokiaNative5320.py "$stage/synthDrivers/nokiaNative5320.py"
          Copy-Item build/native-x86/nokia_runtime_5320_x86.dll "$stage/bin/x86/"
          Copy-Item build/native-x64/nokia_runtime_5320_x64.dll "$stage/bin/x64/"
          Copy-Item build/runtime-arm64/nokia_runtime_5320_arm64.dll "$stage/bin/arm64/"
          Copy-Item build/runtime-arm64ec/nokia_runtime_5320_arm64ec.dll "$stage/bin/arm64ec/"
          $snapshot = Get-ChildItem -Recurse build/full-aot -Filter '5320-de-male.snapshot' | Select-Object -First 1 -ExpandProperty FullName
          if (!$snapshot) { throw 'Native snapshot not found in full-AOT artifact' }
          Copy-Item $snapshot "$stage/data/5320-de-male.snapshot"
          Copy-Item build/test18-addon/data/SYM.ROM "$stage/data/SYM.ROM"
          Copy-Item build/test18-addon/data/config/srsf_*_*.bin "$stage/data/config/"
          Compress-Archive -Path "$stage/*" -DestinationPath build/nokiaNative5320-0.1.0-test29.zip -Force
          Move-Item build/nokiaNative5320-0.1.0-test29.zip build/nokiaNative5320-0.1.0-test29.nvda-addon

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            'build/addon/manifest.ini',
            'build/addon/synthDrivers/nokiaNative5320.py',
            'build/addon/bin/x86/nokia_runtime_5320_x86.dll',
            'build/addon/bin/x64/nokia_runtime_5320_x64.dll',
            'build/addon/bin/arm64/nokia_runtime_5320_arm64.dll',
            'build/addon/bin/arm64ec/nokia_runtime_5320_arm64ec.dll',
            'build/addon/data/5320-de-male.snapshot',
            'build/addon/data/SYM.ROM'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing package file: $path" }
          }
          $configCount = @(Get-ChildItem build/addon/data/config/srsf_*_*.bin).Count
          if ($configCount -eq 0) { throw 'No srsf configuration blobs packaged' }
          Write-Host "Packaged configuration blobs: $configCount"
          Get-Item build/nokiaNative5320-0.1.0-test29.nvda-addon | Format-List Name,Length

      - name: Upload NVDA add-on
        uses: actions/upload-artifact@v6
        with:
          name: nokiaNative5320-0.1.0-test29
          path: build/nokiaNative5320-0.1.0-test29.nvda-addon
          if-no-files-found: error
