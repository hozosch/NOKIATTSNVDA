name: Build multilingual native Nokia 5320 and 5500 NVDA add-on

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test native prosody rate and seamless long-text filters
        run: |
          gcc -std=c11 -O2 tests/runtime_output_filter_test.c -o /tmp/runtime_output_filter_test
          /tmp/runtime_output_filter_test
          gcc -std=c11 -O2 -DNOKIA_CONTINUE_PROSODY=1 tests/runtime_output_filter_test.c -o /tmp/runtime_output_filter_continuation_test
          /tmp/runtime_output_filter_continuation_test
          python tests/test_native_5320_driver_voices.py
          python -m py_compile \
            addon/synthDrivers/nokiaNative5320.py \
            tools/build_config_pack.py \
            tools/collect_frontend_closure.py \
            tools/collect_native_klatt_trace.py \
            tools/extract_5320_aot_delta.py \
            tools/extend_aot_in_batches.py \
            tools/extend_prime_aot.py \
            tools/extend_split_frontend_aot.py \
            tools/filter_native_lifecycle_trace.py \
            tools/filter_trace_to_source_labels.py \
            tools/generate_frontend_aot_from_trace.py \
            tools/generate_klatt_aot.py \
            tools/make_frontend_aot_seed.py \
            tools/patch_5320_executive_calls.py \
            tools/smoke_native_5320_runtime.py \
            tools/smoke_native_5320_voices.py \
            tools/smoke_native_5500_voices.py

  prepare-multilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen Test 18 firmware
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Extract frozen 5320 ROM
        shell: bash
        run: |
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" data/SYM.ROM -d build/test18-addon

      - name: Reuse verified Test58 multilingual AOT and snapshots
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-multilingual-input
          path: build/multilingual-input
          repository: hozosch/NOKIATTSNVDA
          run-id: 34218642360
          github-token: ${{ github.token }}

      - name: Verify reused multilingual input
        shell: bash
        run: |
          source=$(find build/multilingual-input -name 'nokia_frontend_5320_full.c' -print -quit)
          test -n "$source"
          echo "a70e985fc0fe4e66cd4fa76aa0ad25aadae7c8207282b07634e9c87abd8867df  build/multilingual-input/snapshots/5320-3-male.snapshot" | sha256sum --check
          test "$(find build/multilingual-input/snapshots -name '*.snapshot' | wc -l)" -eq 66

      - name: Add Greek gamma DSP path to reused AOT
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          source=$(find build/multilingual-input -name 'nokia_frontend_5320_full.c' -print -quit)
          test -n "$source"
          python tools/extend_split_frontend_aot.py \
            --source "$source" \
            --trace native/5320-greek-aot-delta.json \
            --rom build/test18-addon/data/SYM.ROM \
            --output "$source" \
            --include-dsp
          grep -q '^L_830ff5a4:$' "$source"

      - name: Upload multilingual AOT and snapshots
        uses: actions/upload-artifact@v6
        with:
          name: nokia-5320-multilingual-input
          path: build/multilingual-input
          if-no-files-found: error
          compression-level: 9

  arm:
    needs: [prepare-multilingual]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen Test 18 firmware and configuration
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Extract frozen Test 18 data
        shell: bash
        run: |
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon
      - name: Download multilingual AOT and snapshots
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-multilingual-input
          path: build/multilingual-input
      - name: Build current ARM64 and ARM64EC runtimes
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch arm64
          New-Item -ItemType Directory -Force native/generated/full, build/native-arm64, build/native-arm64ec | Out-Null
          Get-ChildItem -Recurse build/multilingual-input -Filter "nokia_frontend_5320_full*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/full/ -Force
          }
          gzip -dk native/generated/nokia_klatt_5320.c.gz
          python tools/patch_5320_klatt_normalization_loop.py native/generated/nokia_klatt_5320.c
          if ($LASTEXITCODE -ne 0) { throw 'Klatt loop repair failed' }
          Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object {
            python tools/instrument_rom_pages.py $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'frontend ROM-read instrumentation failed' }
          }
          python tools/instrument_rom_pages.py native/generated/nokia_klatt_5320.c
          if ($LASTEXITCODE -ne 0) { throw 'Klatt ROM-read instrumentation failed' }
          python .github/scripts/instrument_runtime_lifecycle.py native/nokia_runtime.c
          if ($LASTEXITCODE -ne 0) { throw 'runtime instrumentation failed' }
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /arm64EC /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /DNOKIA_CONTINUE_PROSODY=1 /LD $sources /link /MACHINE:ARM64EC /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-arm64ec/nokia_runtime_5320_arm64ec.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64EC runtime link failed' }
          $dllBytes = [IO.File]::ReadAllBytes('build/native-arm64ec/nokia_runtime_5320_arm64ec.dll')
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          if ($machine -notin @(0x8664, 0xA641, 0xA64E)) { throw "runtime machine is 0x$($machine.ToString('X4')), not ARM64EC-compatible" }
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /DNOKIA_CONTINUE_PROSODY=1 /LD $sources /link /MACHINE:ARM64 /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-arm64/nokia_runtime_5320_arm64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 runtime link failed' }
          $dllBytes = [IO.File]::ReadAllBytes('build/native-arm64/nokia_runtime_5320_arm64.dll')
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw "runtime machine is 0x$($machine.ToString('X4')), not ARM64" }
      - name: Prepare portable x64 Python for ARM64EC verification
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip \
            --output build/python-x64.zip
          echo "f6cca216a359be84797cabb54149ce5e062afb16cc7567eb7fc51cacb2d86b65  build/python-x64.zip" | sha256sum --check
          mkdir -p build/python-x64
          unzip -q build/python-x64.zip -d build/python-x64
          echo "../../tools" >> build/python-x64/python313._pth
          build/python-x64/python.exe --version
          build/python-x64/python.exe -c "import build_config_pack; print('portable Python tool imports verified')"
      - name: Smoke-test ARM64EC synthesis
        shell: bash
        run: |
          snapshot=$(find build/multilingual-input -name '5320-3-male.snapshot' -print -quit)
          build/python-x64/python.exe tools/smoke_native_5320_runtime.py \
            build/native-arm64ec/nokia_runtime_5320_arm64ec.dll \
            build/test18-addon/data/SYM.ROM \
            "$snapshot" \
            build/test18-addon/data/config \
            --rom-trace build/native-arm64ec/rom-pages.json
      - name: Build compact 5320 TTS page container
        shell: bash
        run: |
          python tools/build_rom_pack.py \
            build/test18-addon/data/SYM.ROM \
            native/rom-pages-5320-known-good.json \
            build/native-arm64ec/rom-pages.json \
            build/runtime-data/5320-core.nrp \
            --padding-pages 2
      - name: Smoke-test ARM64EC compact container
        shell: bash
        run: |
          snapshot=$(find build/multilingual-input -name '5320-3-male.snapshot' -print -quit)
          build/python-x64/python.exe tools/smoke_native_5320_runtime.py \
            build/native-arm64ec/nokia_runtime_5320_arm64ec.dll \
            build/runtime-data/5320-core.nrp \
            "$snapshot" \
            build/test18-addon/data/config
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Smoke-test ARM64 synthesis
        shell: bash
        run: |
          snapshot=$(find build/multilingual-input -name '5320-3-male.snapshot' -print -quit)
          python tools/smoke_native_5320_runtime.py \
            build/native-arm64/nokia_runtime_5320_arm64.dll \
            build/test18-addon/data/SYM.ROM \
            "$snapshot" \
            build/test18-addon/data/config \
            --rom-trace build/native-arm64/rom-pages.json
      - name: Smoke-test ARM64 compact container
        shell: bash
        run: |
          snapshot=$(find build/multilingual-input -name '5320-3-male.snapshot' -print -quit)
          python tools/smoke_native_5320_runtime.py \
            build/native-arm64/nokia_runtime_5320_arm64.dll \
            build/runtime-data/5320-core.nrp \
            "$snapshot" \
            build/test18-addon/data/config
      - uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-arm64ec-current
          path: build/native-arm64ec/nokia_runtime_5320_arm64ec.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-arm64-current
          path: build/native-arm64/nokia_runtime_5320_arm64.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: nokia-rom-pack-5320-current
          path: build/runtime-data/5320-core.nrp
          if-no-files-found: error

  arm-5500:
    needs: [source-tests]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Expand frozen Nokia 5500 inputs
        shell: bash
        run: |
          mkdir -p build/5500 build/native-5500-arm64 build/native-5500-arm64ec
          gzip -dc native/generated/nokia_frontend_5500_full.c.gz > build/5500/nokia_frontend_5500_full.c
          gzip -dc native/generated/nokia_klatt_5500.c.gz > build/5500/nokia_klatt_5500.c
          gzip -dc native/generated/5500-core.nrp.gz > build/5500/5500-core.nrp
          gzip -dc native/generated/5500-config.ncf.gz > build/5500/5500-config.ncf
          mkdir -p build/5500/snapshots
          for snapshot in native/generated/5500-snapshots/*.snapshot.gz; do
            name=$(basename "$snapshot" .gz)
            gzip -dc "$snapshot" > "build/5500/snapshots/$name"
          done
          test "$(find build/5500/snapshots -name '5500-*.snapshot' | wc -l)" -eq 5
          grep -q '^L_f844e280:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84516cc:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f845180e:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8451816:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8451a12:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8451a14:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8451e9a:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84609da:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8461900:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8453c74:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8453cb8:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f845a6a8:$' build/5500/nokia_klatt_5500.c
          grep -q '^L_f845a6aa:$' build/5500/nokia_klatt_5500.c
          grep -q '^L_fa30d944:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_fa30d966:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_fa30e250:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844ee7a:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844faa4:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8457144:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8450678:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84506b6:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844deb0:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84571d2:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844ecfa:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844ed46:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84506c0:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84506ca:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84501b2:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84501b4:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844df1a:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844df4e:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844ed48:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844ed94:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f845347a:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f845353c:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8455b54:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84567ee:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84553e0:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f8455f56:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84547ac:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84547ca:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844fb54:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844fbde:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844fc08:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84500ea:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f844fc3e:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f84553de:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f81de230:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f81de234:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f81de66c:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f81de6d4:$' build/5500/nokia_frontend_5500_full.c
          grep -q '^L_f81f42c4:$' build/5500/nokia_frontend_5500_full.c
          python tools/instrument_rom_pages.py \
            build/5500/nokia_frontend_5500_full.c \
            build/5500/nokia_klatt_5500.c
          python .github/scripts/instrument_runtime_lifecycle.py native/nokia_runtime.c

      - name: Build ARM64 and ARM64EC Nokia 5500 runtimes
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch arm64
          $sources = @(
            'native/nokia_runtime.c',
            'native/nokia_config_blobs.c',
            'build/5500/nokia_klatt_5500.c',
            'build/5500/nokia_frontend_5500_full.c'
          )
          cl /nologo /arm64EC /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /DNOKIA_CONTINUE_PROSODY=1 /LD $sources /link /MACHINE:ARM64EC /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-5500-arm64ec/nokia_runtime_5500_arm64ec.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native Nokia 5500 ARM64EC runtime link failed' }
          $dllBytes = [IO.File]::ReadAllBytes('build/native-5500-arm64ec/nokia_runtime_5500_arm64ec.dll')
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          if ($machine -notin @(0x8664, 0xA641, 0xA64E)) { throw "Nokia 5500 runtime machine is 0x$($machine.ToString('X4')), not ARM64EC-compatible" }
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /DNOKIA_CONTINUE_PROSODY=1 /LD $sources /link /MACHINE:ARM64 /LTCG /OPT:REF /OPT:ICF "/OUT:build/native-5500-arm64/nokia_runtime_5500_arm64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native Nokia 5500 ARM64 runtime link failed' }
          $dllBytes = [IO.File]::ReadAllBytes('build/native-5500-arm64/nokia_runtime_5500_arm64.dll')
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw "Nokia 5500 runtime machine is 0x$($machine.ToString('X4')), not ARM64" }

      - name: Prepare portable x64 Python for ARM64EC verification
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip \
            --output build/python-x64.zip
          echo "f6cca216a359be84797cabb54149ce5e062afb16cc7567eb7fc51cacb2d86b65  build/python-x64.zip" | sha256sum --check
          mkdir -p build/python-x64
          unzip -q build/python-x64.zip -d build/python-x64
          echo "../../tools" >> build/python-x64/python313._pth

      - name: Smoke-test ARM64EC Nokia 5500 voices
        shell: bash
        run: |
          build/python-x64/python.exe tools/smoke_native_5500_voices.py \
            build/native-5500-arm64ec/nokia_runtime_5500_arm64ec.dll \
            build/5500/5500-core.nrp \
            build/5500/snapshots \
            build/5500/5500-config.ncf

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Smoke-test ARM64 Nokia 5500 voices
        shell: bash
        run: |
          python tools/smoke_native_5500_voices.py \
            build/native-5500-arm64/nokia_runtime_5500_arm64.dll \
            build/5500/5500-core.nrp \
            build/5500/snapshots \
            build/5500/5500-config.ncf

      - uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5500-arm-current
          path: |
            build/native-5500-arm64/nokia_runtime_5500_arm64.dll
            build/native-5500-arm64ec/nokia_runtime_5500_arm64ec.dll
          if-no-files-found: error

  package:
    needs: [arm, arm-5500, prepare-multilingual, source-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen Test 18 firmware and configuration
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Extract frozen Test 18 data
        shell: bash
        run: |
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon

      - name: Download multilingual AOT and snapshots
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-multilingual-input
          path: build/multilingual-input

      - name: Download current ARM64EC runtime
        uses: actions/download-artifact@v7
        with:
          name: nokia-runtime-5320-arm64ec-current
          path: build/runtime-arm64ec

      - name: Download current ARM64 runtime
        uses: actions/download-artifact@v7
        with:
          name: nokia-runtime-5320-arm64-current
          path: build/runtime-arm64

      - name: Download current Nokia 5500 ARM runtimes
        uses: actions/download-artifact@v7
        with:
          name: nokia-runtime-5500-arm-current
          path: build/runtime-5500-arm

      - name: Download compact 5320 TTS page container
        uses: actions/download-artifact@v7
        with:
          name: nokia-rom-pack-5320-current
          path: build/runtime-data

      - name: Pack deduplicated 5320 configuration
        shell: bash
        run: |
          python tools/build_config_pack.py \
            build/test18-addon/data/config \
            build/runtime-data/5320-config.ncf

      - name: Expand frozen Nokia 5500 inputs
        shell: bash
        run: |
          mkdir -p build/5500/snapshots build/runtime-data
          gzip -dc native/generated/nokia_frontend_5500_full.c.gz > build/5500/nokia_frontend_5500_full.c
          gzip -dc native/generated/nokia_klatt_5500.c.gz > build/5500/nokia_klatt_5500.c
          gzip -dc native/generated/5500-core.nrp.gz > build/runtime-data/5500-core.nrp
          gzip -dc native/generated/5500-config.ncf.gz > build/runtime-data/5500-config.ncf
          for snapshot in native/generated/5500-snapshots/*.snapshot.gz; do
            name=$(basename "$snapshot" .gz)
            gzip -dc "$snapshot" > "build/5500/snapshots/$name"
          done
