name: Build native-only Nokia 5320 runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "tools/**"
      - ".github/scripts/patch_5320_prime_iterator.py"
      - ".github/scripts/patch_5320_prime_counterloop.py"
      - ".github/scripts/patch_5320_exclusive_clear.py"
      - ".github/scripts/patch_5320_zero_veneer.py"
      - ".github/workflows/build-native-only-5320.yml"

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen full lifecycle trace
        uses: actions/download-artifact@v7
        with:
          name: nokia-frontend-generated
          path: build/frozen-trace
          repository: hozosch/NOKIATTSNVDA
          run-id: 33188121016
          github-token: ${{ github.token }}

      - name: Download frozen Test 18 firmware and configuration
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Generate native-only AOT and snapshot
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon
          cp build/test18-addon/data/SYM.ROM build-5320.rom
          mkdir -p build/native native/generated/full
          cp build/test18-addon/data/5320-de-male.snapshot \
            build/native/5320-de-male.snapshot
          cp build/frozen-trace/build/native/full-lifecycle-trace.json \
            build/native/full-lifecycle-trace.json
          python tools/filter_5320_native_lifecycle_trace.py \
            build/native/full-lifecycle-trace.json \
            native/generated/nokia_klatt_5320.c.gz \
            build/native/native-lifecycle-trace.json

          # Close input-dependent frontend alternatives before lifting.  This
          # replaces the former one-address-at-a-time runtime patch cycle.
          python tools/expand_5320_frontend_control_flow.py \
            build-5320.rom \
            build/native/native-lifecycle-trace.json \
            build/native/native-lifecycle-closed.json \
            --max-external-call-depth 2 \
            --max-new-instructions 120000 \
            --auto-thumb-switch16 \
            --thumb-switch16 0x830e9024:0x830e9026:110
          mv build/native/native-lifecycle-closed.json \
            build/native/native-lifecycle-trace.json

          # The frontend reaches a DSP switch8 thunk through an indirect ARM
          # veneer.  Close every valid halfword case at build time so different
          # text/configuration opcodes do not reveal one wrapper entry per run.
          python tools/collect_5320_dsp_wrapper_trace.py \
            build-5320.rom build/native/dsp-helper-9d60.json \
            --entry 0x830f9d60
          python tools/collect_5320_dsp_wrapper_trace.py \
            build-5320.rom build/native/dsp-switch8.json \
            --switch8-base 0x830fad30 \
            --switch8-last 0x830fae42
          # Close the exact destinations encoded after the __switch8 call at
          # 0x830fde98.  Its inline table selects 23 small DSP wrappers; the
          # recorded German smoke phrase exercised only a subset of them.
          python tools/collect_5320_dsp_wrapper_trace.py \
            build-5320.rom build/native/dsp-inline-switch8-de9d.json \
            --switch8-lr 0x830fde9d \
            --known-trace build/native/native-lifecycle-trace.json \
            --known-trace build/native/dsp-helper-9d60.json \
            --known-trace build/native/dsp-switch8.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('build/native/native-lifecycle-trace.json')
          helper_paths=[
              Path('build/native/dsp-helper-9d60.json'),
              Path('build/native/dsp-switch8.json'),
              Path('build/native/dsp-inline-switch8-de9d.json'),
          ]
          p=json.loads(base.read_text(encoding='utf-8'))
          by_key={(int(i['address']),bool(i.get('thumb',False))):i for i in p['instructions']}
          counts={}
          switch=None
          inline_switches=[]
          for helper in helper_paths:
              h=json.loads(helper.read_text(encoding='utf-8'))
              counts[helper.stem]=h['instruction_count']
              if h.get('switch8_base') is not None:
                  switch=h
              if h.get('switch8_lrs'):
                  inline_switches.append(h)
              for item in h['instructions']:
                  by_key[(int(item['address']),bool(item.get('thumb',False)))]=item
          if switch is None:
              raise SystemExit('DSP switch8 closure was not generated')
          p['instructions']=sorted(by_key.values(),key=lambda i:(int(i['address']),bool(i.get('thumb',False))))
          p['instruction_count']=len(p['instructions'])
          p['extra_dsp_helper_entries']=[
              '0x830f9d60',
              'switch8:0x830fad30-0x830fae42',
              'switch8-inline-lr:0x830fde9d',
          ]
          p['extra_dsp_helper_counts']=counts
          p['dsp_switch8_candidate_count']=len(switch['entries'])
          p['dsp_switch8_successful_count']=len(switch['successful_entries'])
          p['dsp_switch8_skipped_count']=len(switch['skipped_entries'])
          p['dsp_switch8_instruction_count']=switch['instruction_count']
          p['dsp_switch8_unresolved_terminals']=switch['unresolved_terminals']
          p['dsp_inline_switch8_lrs']=[
              lr for h in inline_switches for lr in h['switch8_lrs']
          ]
          p['dsp_inline_switch8_candidate_count']=sum(
              len(h['entries']) for h in inline_switches
          )
          p['dsp_inline_switch8_successful_count']=sum(
              len(h['successful_entries']) for h in inline_switches
          )
          p['dsp_inline_switch8_skipped_count']=sum(
              len(h['skipped_entries']) for h in inline_switches
          )
          p['dsp_inline_switch8_instruction_count']=sum(
              h['instruction_count'] for h in inline_switches
          )
          p['dsp_inline_switch8_unresolved_terminals']=[
              terminal
              for h in inline_switches
              for terminal in h['unresolved_terminals']
          ]
          base.write_text(json.dumps(p,indent=2)+'\n',encoding='utf-8')
          print('merged DSP helper entries:',p['extra_dsp_helper_entries'])
          print('DSP helper closure counts:',counts)
          print('switch8 candidates:',p['dsp_switch8_candidate_count'])
          print('switch8 successful entries:',p['dsp_switch8_successful_count'])
          print('switch8 skipped invalid entries:',p['dsp_switch8_skipped_count'])
          print('switch8 union instructions:',p['dsp_switch8_instruction_count'])
          print('switch8 unresolved terminals:',p['dsp_switch8_unresolved_terminals'])
          print('inline switch8 LRs:',p['dsp_inline_switch8_lrs'])
          print('inline switch8 candidates:',p['dsp_inline_switch8_candidate_count'])
          print('inline switch8 successful entries:',p['dsp_inline_switch8_successful_count'])
          print('inline switch8 skipped entries:',p['dsp_inline_switch8_skipped_count'])
          print('inline switch8 union instructions:',p['dsp_inline_switch8_instruction_count'])
          print('inline switch8 unresolved terminals:',p['dsp_inline_switch8_unresolved_terminals'])
          for address in (0x830f9d60,0x830fad30,0x830fae2c,0x830fae3c,0x830fae42,0x830fb16e):
              print(f'0x{address:08x} present:',any(int(i['address'])==address for i in p['instructions']))
          print('native lifecycle instructions after merge:',p['instruction_count'])
          PY

          python - <<'PY'
          from pathlib import Path
          src=Path('tools/extend_prime_aot.py').read_text(encoding='utf-8')
          old='''                 not (0x830F7A48 <= item["address"] < 0x83102E00)]'''
          new='''                 True]'''
          if old not in src:
              raise SystemExit('DSP exclusion expression not found in lifter')
          src=src.replace(old,new,1)
          # Old corpus branches may target labels that already existed before
          # the current batch. Repair against the whole known corpus, not only
          # labels lifted by this one invocation.
          src=src.replace('if target not in lifted:\n                continue',
                          'if target not in known:\n                continue')
          src=src.replace('address + item["size"] not in lifted',
                          'address + item["size"] not in known')
          Path('build/extend_native_lifecycle.py').write_text(src,encoding='utf-8')
          PY
          python tools/extend_aot_in_batches.py \
            --lifter build/extend_native_lifecycle.py \
            --source native/generated/nokia_frontend_5320.c.gz \
            --trace build/native/native-lifecycle-trace.json \
            --rom build-5320.rom \
            --output native/generated/full/nokia_frontend_5320_full.c \
            --batch-size 600 --repair-fallthroughs
          python tools/split_frontend_aot.py native/generated/full/nokia_frontend_5320_full.c
          python tools/add_5320_native_klatt_boundary.py native/generated/full/nokia_frontend_5320_full.c
          python tools/optimise_frontend_memory.py native/generated/full/nokia_frontend_5320_full.c
          python tools/patch_5320_prime_hotloop.py native/generated/full/nokia_frontend_5320_full.c
          python .github/scripts/patch_5320_prime_iterator.py native/generated/full/nokia_frontend_5320_full.c
          python .github/scripts/patch_5320_prime_counterloop.py native/generated/full/nokia_frontend_5320_full.c
          python .github/scripts/patch_5320_exclusive_clear.py native/generated/full/nokia_frontend_5320_full.c
          python .github/scripts/patch_5320_zero_veneer.py native/generated/full/nokia_frontend_5320_full.c
          python tools/instrument_frontend_yields.py native/generated/full/nokia_frontend_5320_full.c
          python tools/report_frontend_yields.py \
            native/generated/full/nokia_frontend_5320_full.c \
            --json build/native/full-frontend-yields.json

      - name: Report native-only corpus
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          full=json.load(open('build/native/full-lifecycle-trace.json', encoding='utf-8'))
          native=json.load(open('build/native/native-lifecycle-trace.json', encoding='utf-8'))
          labels=0
          corpus='\n'.join(p.read_text(encoding='utf-8') for p in Path('native/generated/full').glob('nokia_frontend_5320_full*.c'))
          labels=len(re.findall(r'(?m)^L_[0-9a-f]{8}:$',corpus))
          print('full lifecycle instructions:', full['instruction_count'])
          print('native lifecycle after Klatt/helper merge:', native['instruction_count'])
          print('static control-flow original instructions:', native.get('static_control_flow_original_instructions'))
          print('static control-flow additions:', native.get('static_control_flow_additions'))
          print('static control-flow processed instructions:', native.get('static_control_flow_processed_instructions'))
          print('static control-flow skipped calls:', native.get('static_control_flow_skipped_calls'))
          print('static control-flow decode errors:', native.get('static_control_flow_decode_errors'))
          print('static control-flow control errors:', native.get('static_control_flow_control_errors'))
          print('static control-flow mode conflicts:', native.get('static_control_flow_mode_conflicts'))
          print('static control-flow switch16 tables:', native.get('static_control_flow_switch16_tables'))
          print('extra DSP helper entries:', native.get('extra_dsp_helper_entries'))
          print('extra DSP helper counts:', native.get('extra_dsp_helper_counts'))
          print('translated labels:', labels)
          required_dsp=(
              0x830f9d60, 0x830fad30, 0x830fae2c,
              0x830fae3c, 0x830fae42, 0x830fb16e,
          )
          missing_dsp=[
              address for address in required_dsp
              if f'L_{address:08x}:' not in corpus
          ]
          for address in required_dsp:
              print(f'closed DSP switch label 0x{address:08x}:',
                    f'L_{address:08x}:' in corpus)
          if missing_dsp:
              raise SystemExit(
                  'required DSP switch label missing from final AOT corpus: ' +
                  ', '.join(f'0x{x:08x}' for x in missing_dsp)
              )
          switch_stats=(
              native.get('dsp_switch8_candidate_count'),
              native.get('dsp_switch8_successful_count'),
              native.get('dsp_switch8_skipped_count'),
              native.get('dsp_switch8_instruction_count'),
          )
          print('DSP switch8 stats:',switch_stats)
          if switch_stats != (138,130,8,581):
              raise SystemExit(f'unexpected DSP switch8 closure statistics: {switch_stats}')
          if native.get('dsp_switch8_unresolved_terminals'):
              raise SystemExit('DSP switch8 closure has unresolved terminals')
          inline_stats=(
              native.get('dsp_inline_switch8_candidate_count'),
              native.get('dsp_inline_switch8_successful_count'),
              native.get('dsp_inline_switch8_skipped_count'),
          )
          print('DSP inline switch8 stats:',inline_stats)
          if native.get('dsp_inline_switch8_lrs') != ['0x830fde9d']:
              raise SystemExit(
                  'unexpected DSP inline switch8 LR set: ' +
                  repr(native.get('dsp_inline_switch8_lrs'))
              )
          if inline_stats != (23,23,0):
              raise SystemExit(
                  f'unexpected DSP inline switch8 statistics: {inline_stats}'
              )
          if native.get('dsp_inline_switch8_unresolved_terminals'):
              raise SystemExit(
                  'DSP inline switch8 closure has unresolved terminals'
              )
          inline_switch_entries=(
              0x830fdeb4,0x830fdec0,0x830fdec2,0x830fdecc,
              0x830fded6,0x830fdee4,0x830fdeee,0x830fdef8,
              0x830fdf06,0x830fdf10,0x830fdf1e,0x830fdf2c,
              0x830fdf3a,0x830fdf48,0x830fdf56,0x830fdf64,
              0x830fdf6e,0x830fdf78,0x830fdf82,0x830fdf8c,
              0x830fdf9a,0x830fdfa4,0x830fdfb2,
          )
          missing_inline=[
              address for address in inline_switch_entries
              if f'L_{address:08x}:' not in corpus
          ]
          for address in inline_switch_entries:
              print(f'closed inline switch label 0x{address:08x}:',
                    f'L_{address:08x}:' in corpus)
          if missing_inline:
              raise SystemExit(
                  'inline switch8 closure missed labels: ' +
                  ', '.join(f'0x{x:08x}' for x in missing_inline)
              )
          regression_addresses=(
              0x830ea398, 0x830ea3d0, 0x830eccd2, 0x830ecbc2,
              0x830dbbd0, 0x830db366, 0x830db3b8,
          )
          missing=[
              address for address in regression_addresses
              if f'L_{address:08x}:' not in corpus
          ]
          for address in regression_addresses:
              print(f'closed regression label 0x{address:08x}:',
                    f'L_{address:08x}:' in corpus)
          if missing:
              raise SystemExit(
                  'static control-flow closure missed regression labels: ' +
                  ', '.join(f'0x{x:08x}' for x in missing)
              )
          if native.get('static_control_flow_control_errors'):
              raise SystemExit('static control-flow closure has unresolved direct targets')
          switch16=native.get('static_control_flow_switch16_tables') or []
          by_base={table.get('table_base'):table for table in switch16}
          if len(by_base) != len(switch16):
              raise SystemExit(f'duplicate switch16 tables: {switch16!r}')
          print('closed switch16 table count:',len(switch16))
          table=by_base.get('0x830e9024') or {}
          if (
              table.get('table_base') != '0x830e9024'
              or table.get('target_base') != '0x830e9026'
              or table.get('case_count') != 110
              or table.get('unique_target_count') != 71
          ):
              raise SystemExit(f'unexpected switch16 table metadata: {table!r}')
          required_switch16=(
              0x830e93ce, 0x830ea956, 0x830ead6c, 0x830eb2a4,
              0x830ed036, 0x830ed03a,
          )
          missing_switch16=[
              address for address in required_switch16
              if f'L_{address:08x}:' not in corpus
          ]
          for address in required_switch16:
              print(f'closed switch16 label 0x{address:08x}:',
                    f'L_{address:08x}:' in corpus)
          if missing_switch16:
              raise SystemExit(
                  'switch16 closure missed regression labels: ' +
                  ', '.join(f'0x{x:08x}' for x in missing_switch16)
              )
          expected_auto_switch16={
              '0x830ea000':(5,5),
              '0x830eb316':(5,5),
              '0x830eb622':(15,14),
          }
          for base,(case_count,unique_count) in expected_auto_switch16.items():
              table=by_base.get(base) or {}
              stats=(table.get('case_count'),table.get('unique_target_count'))
              print(f'auto switch16 {base} stats:',stats)
              if stats != (case_count,unique_count):
                  raise SystemExit(
                      f'auto switch16 {base} has unexpected statistics: {stats}'
                  )
          nested_switch_labels=(
              0x830ea00a,0x830ea014,0x830ea05c,
              0x830eb320,0x830eb358,0x830eb3ec,0x830eb4d0,
              0x830eb640,0x830eb6ac,0x830eb740,0x830eb800,
              0x830eb8be,0x830eb956,0x830eb9ce,0x830eba52,
              0x830eba9e,0x830ebaca,0x830ebb5e,
          )
          missing_nested=[
              address for address in nested_switch_labels
              if f'L_{address:08x}:' not in corpus
          ]
          for address in nested_switch_labels:
              print(f'closed nested switch label 0x{address:08x}:',
                    f'L_{address:08x}:' in corpus)
          if missing_nested:
              raise SystemExit(
                  'nested switch closure missed labels: ' +
                  ', '.join(f'0x{x:08x}' for x in missing_nested)
              )
          print('snapshot bytes:', Path('build/native/5320-de-male.snapshot').stat().st_size)
          PY

      - name: Upload full lifecycle AOT
        uses: actions/upload-artifact@v6
        with:
          name: nokia-5320-full-aot
          path: |
            native/generated/full/nokia_frontend_5320_full*.c
            build/native/full-lifecycle-trace.json
            build/native/native-lifecycle-trace.json
            build/native/dsp-helper-9d60.json
            build/native/dsp-switch8.json
            build/native/dsp-inline-switch8-de9d.json
            build/native/full-frontend-yields.json
            build/native/5320-de-male.snapshot
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            suffix: x64
          - runner: windows-11-arm
            arch: arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen Test 18 firmware and configuration
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Extract frozen Test 18 data
        shell: bash
        run: |
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon

      - name: Download full lifecycle AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/full-aot

      - name: Install generated sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/generated/full | Out-Null
          Get-ChildItem -Recurse build/full-aot -Filter "nokia_frontend_5320_full*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/full/ -Force
          }
          $snapshot = Get-ChildItem -Recurse build/full-aot -Filter "5320-de-male.snapshot" | Select-Object -First 1
          New-Item -ItemType Directory -Force build/native | Out-Null
          Copy-Item $snapshot.FullName build/native/5320-de-male.snapshot -Force

      - name: Expand Klatt source
        shell: bash
        run: gzip -dk native/generated/nokia_klatt_5320.c.gz

      - name: Build native-only linked runtime
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force build/native | Out-Null
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /LTCG /OPT:REF /OPT:ICF "/OUT:build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native-only runtime link failed' }
          $imports = dumpbin /imports "build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll"
          $imports | Select-String -Pattern 'DLL name'
          if ($imports -match 'unicorn' -or $imports -match 'python3') {
            throw 'native-only runtime imports Unicorn or Python'
          }
          dumpbin /exports "build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll"

      - name: Smoke test native synthesis
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          python tools/smoke_native_5320_runtime.py \
            build/native/nokia_runtime_5320_x64.dll \
            build/test18-addon/data/SYM.ROM \
            build/native/5320-de-male.snapshot \
            build/test18-addon/data/config

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-${{ matrix.suffix }}
          path: |
            build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll
            build/native/5320-de-male.snapshot
          if-no-files-found: error
