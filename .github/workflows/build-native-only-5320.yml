name: Build native-only Nokia 5320 runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "tools/**"
      - ".github/workflows/build-native-only-5320.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen full lifecycle trace
        uses: actions/download-artifact@v7
        with:
          name: nokia-frontend-generated
          path: build/frozen-trace
          repository: hozosch/NOKIATTSNVDA
          run-id: 33188121016
          github-token: ${{ github.token }}

      - name: Generate native-only AOT and snapshot
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/upstream
          cp build/upstream/addon/roms/5320/SYM.ROM build-5320.rom
          mkdir -p build/native native/generated/full
          cp build/frozen-trace/build/native/full-lifecycle-trace.json build/native/full-lifecycle-trace.json
          python tools/build_5320_native_snapshot.py \
            build/upstream build/native/5320-de-male.snapshot \
            --language 3 --voice DefaultMale
          python tools/filter_5320_native_lifecycle_trace.py \
            build/native/full-lifecycle-trace.json \
            native/generated/nokia_klatt_5320.c.gz \
            build/native/native-lifecycle-trace.json
          python - <<'PY'
          from pathlib import Path
          src=Path('tools/extend_prime_aot.py').read_text(encoding='utf-8')
          old='''                 not (0x830F7A48 <= item["address"] < 0x83102E00)]'''
          new='''                 True]'''
          if old not in src:
              raise SystemExit('DSP exclusion expression not found in lifter')
          Path('build/extend_native_lifecycle.py').write_text(src.replace(old,new,1), encoding='utf-8')
          PY
          python tools/extend_aot_in_batches.py \
            --lifter build/extend_native_lifecycle.py \
            --source native/generated/nokia_frontend_5320.c.gz \
            --trace build/native/native-lifecycle-trace.json \
            --rom build-5320.rom \
            --output native/generated/full/nokia_frontend_5320_full.c \
            --batch-size 600 --repair-fallthroughs
          python tools/split_frontend_aot.py native/generated/full/nokia_frontend_5320_full.c
          python tools/add_5320_native_klatt_boundary.py native/generated/full/nokia_frontend_5320_full.c
          python tools/optimise_frontend_memory.py native/generated/full/nokia_frontend_5320_full.c
          python tools/instrument_frontend_yields.py native/generated/full/nokia_frontend_5320_full.c
          python tools/report_frontend_yields.py \
            native/generated/full/nokia_frontend_5320_full.c \
            --json build/native/full-frontend-yields.json

      - name: Report native-only corpus
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          full=json.load(open('build/native/full-lifecycle-trace.json', encoding='utf-8'))
          native=json.load(open('build/native/native-lifecycle-trace.json', encoding='utf-8'))
          labels=0
          for p in Path('native/generated/full').glob('nokia_frontend_5320_full*.c'):
              labels += len(re.findall(r'(?m)^L_[0-9a-f]{8}:$', p.read_text(encoding='utf-8')))
          print('full lifecycle instructions:', full['instruction_count'])
          print('AOT lifecycle after Klatt removal:', native['instruction_count'])
          print('Klatt labels removed:', native.get('klatt_labels_removed'))
          print('translated labels:', labels)
          print('snapshot bytes:', Path('build/native/5320-de-male.snapshot').stat().st_size)
          PY

      - name: Upload full lifecycle AOT
        uses: actions/upload-artifact@v6
        with:
          name: nokia-5320-full-aot
          path: |
            native/generated/full/nokia_frontend_5320_full*.c
            build/native/full-lifecycle-trace.json
            build/native/native-lifecycle-trace.json
            build/native/full-frontend-yields.json
            build/native/5320-de-male.snapshot
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            suffix: x64
          - runner: windows-11-arm
            arch: arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download full lifecycle AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/full-aot

      - name: Install generated sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/generated/full | Out-Null
          Get-ChildItem -Recurse build/full-aot -Filter "nokia_frontend_5320_full*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/full/ -Force
          }
          $snapshot = Get-ChildItem -Recurse build/full-aot -Filter "5320-de-male.snapshot" | Select-Object -First 1
          New-Item -ItemType Directory -Force build/native | Out-Null
          Copy-Item $snapshot.FullName build/native/5320-de-male.snapshot -Force

      - name: Expand Klatt source
        shell: bash
        run: gzip -dk native/generated/nokia_klatt_5320.c.gz

      - name: Build native-only linked runtime
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force build/native | Out-Null
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /LTCG /OPT:REF /OPT:ICF "/OUT:build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native-only runtime link failed' }
          $imports = dumpbin /imports "build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll"
          $imports | Select-String -Pattern 'DLL name'
          if ($imports -match 'unicorn' -or $imports -match 'python3') {
            throw 'native-only runtime imports Unicorn or Python'
          }
          dumpbin /exports "build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll"

      - name: Smoke test native synthesis
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/smoke-upstream
          python tools/smoke_native_5320_runtime.py \
            build/native/nokia_runtime_5320_x64.dll \
            build/smoke-upstream/addon/roms/5320/SYM.ROM \
            build/native/5320-de-male.snapshot \
            build/smoke-upstream/addon/roms/5320/files/system/data

      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-${{ matrix.suffix }}
          path: |
            build/native/nokia_runtime_5320_${{ matrix.suffix }}.dll
            build/native/5320-de-male.snapshot
          if-no-files-found: error
