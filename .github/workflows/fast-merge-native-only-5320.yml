name: Fast native-only Nokia 5320 smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-merge-native-only-5320.yml"
      - "tools/smoke_native_5320_runtime.py"

permissions:
  contents: read

env:
  BASE_RUN: "33335391941"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Download frozen merged AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-merged-aot
          path: build/merged
          github-token: ${{ github.token }}
          repository: hozosch/NOKIATTSNVDA
          run-id: ${{ env.BASE_RUN }}

      - name: Expand Klatt source
        shell: bash
        run: gzip -dk native/generated/nokia_klatt_5320.c.gz

      - name: Prepare bounded debug sources
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path('native/nokia_runtime.c').read_text(encoding='utf-8')
          replacements = {
              'if(!native_call_l(r,r->pt_new,a,3,&pt)||!pt)goto failed;':
                  'if(!native_call_l(r,r->pt_new,a,3,&pt)||!pt){r->last_error=-3101;goto failed;}',
              'if(!native_call(r,r->seg_set_style_id,a,2,&res))goto failed;':
                  'if(!native_call(r,r->seg_set_style_id,a,2,&res)){r->last_error=-3102;goto failed;}',
              'if(!native_call(r,r->seg_set_text_ptr,a,2,&res))goto failed;':
                  'if(!native_call(r,r->seg_set_text_ptr,a,2,&res)){r->last_error=-3103;goto failed;}',
              'if(!native_call_l(r,r->pt_add_segment,a,3,&res))goto failed;':
                  'if(!native_call_l(r,r->pt_add_segment,a,3,&res)){r->last_error=-3104;goto failed;}',
              'if(!native_call_l(r,r->dev_prime,a,2,&res))goto failed;':
                  'if(!native_call_l(r,r->dev_prime,a,2,&res)){r->last_error=-3105;goto failed;}',
              'if(!native_call_l(r,r->dev_synthesize,a,2,&res))goto failed;':
                  'if(!native_call_l(r,r->dev_synthesize,a,2,&res)){r->last_error=-3106;goto failed;}',
              'if(!native_call(r,r->run_if_ready,a,2,&res))goto failed;':
                  'if(!native_call(r,r->run_if_ready,a,2,&res)){r->last_error=-3107;goto failed;}',
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f'lifecycle stage marker not found: {old}')
              src = src.replace(old, new, 1)
          old = 'if(++loops>100000u){r->last_error=-3004;goto failed;}'
          new = 'if(++loops>2000u){r->last_error=-3004;goto failed;}'
          if old not in src:
              raise SystemExit('scheduler pump limit marker not found')
          src = src.replace(old, new, 1)
          Path('build').mkdir(exist_ok=True)
          Path('build/nokia_runtime_fast.c').write_text(src, encoding='utf-8', newline='\n')

          aot_path = Path('build/merged/nokia_frontend_5320_full.c')
          aot = aot_path.read_text(encoding='utf-8')
          chunk0 = 'static int nokia_frontend_chunk_0('
          if chunk0 not in aot:
              raise SystemExit('first AOT chunk marker not found')
          debug_decl = '''static uint32_t nokia_frontend_debug_budget;
static uint32_t nokia_frontend_debug_r0,nokia_frontend_debug_r1,nokia_frontend_debug_r2,nokia_frontend_debug_r3;
static uint32_t nokia_frontend_debug_r4,nokia_frontend_debug_r5,nokia_frontend_debug_r6,nokia_frontend_debug_r7,nokia_frontend_debug_sp;
static uint32_t nokia_frontend_debug_s0,nokia_frontend_debug_s2,nokia_frontend_debug_s4;
NOKIA_EXPORT uint32_t nokia_frontend_debug_r0_value(void){return nokia_frontend_debug_r0;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r1_value(void){return nokia_frontend_debug_r1;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r2_value(void){return nokia_frontend_debug_r2;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r3_value(void){return nokia_frontend_debug_r3;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r4_value(void){return nokia_frontend_debug_r4;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r5_value(void){return nokia_frontend_debug_r5;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r6_value(void){return nokia_frontend_debug_r6;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_r7_value(void){return nokia_frontend_debug_r7;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_sp_value(void){return nokia_frontend_debug_sp;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_s0_value(void){return nokia_frontend_debug_s0;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_s2_value(void){return nokia_frontend_debug_s2;}
NOKIA_EXPORT uint32_t nokia_frontend_debug_s4_value(void){return nokia_frontend_debug_s4;}

'''
          aot = aot.replace(chunk0, debug_decl + chunk0, 1)
          reset = '    nokia_frontend_dirty_mask=0;'
          if reset not in aot:
              raise SystemExit('AOT call reset marker not found')
          aot = aot.replace(reset, reset + '\n    nokia_frontend_debug_budget=500000u;', 1)
          pat = re.compile(r'(nokia_frontend_last_pc=0x[0-9a-f]+u;)')
          capture = (r'\1 if(!nokia_frontend_debug_budget--){'
                     r'nokia_frontend_debug_r0=(uint32_t)reg_r0;nokia_frontend_debug_r1=(uint32_t)reg_r1;'
                     r'nokia_frontend_debug_r2=(uint32_t)reg_r2;nokia_frontend_debug_r3=(uint32_t)reg_r3;'
                     r'nokia_frontend_debug_r4=(uint32_t)reg_r4;nokia_frontend_debug_r5=(uint32_t)reg_r5;'
                     r'nokia_frontend_debug_r6=(uint32_t)reg_r6;nokia_frontend_debug_r7=(uint32_t)reg_r7;'
                     r'nokia_frontend_debug_sp=(uint32_t)reg_sp;'
                     r'nokia_frontend_debug_s0=(uint32_t)nokia_mem_load(&machine,(uint32_t)reg_r4,2);'
                     r'nokia_frontend_debug_s2=(uint32_t)nokia_mem_load(&machine,(uint32_t)reg_r4+2u,2);'
                     r'nokia_frontend_debug_s4=(uint32_t)nokia_mem_load(&machine,(uint32_t)reg_r4+4u,4);'
                     r'return NOKIA_FRONTEND_YIELDED;}')
          aot, count = pat.subn(capture, aot)
          if count < 1000:
              raise SystemExit(f'unexpectedly few AOT labels instrumented: {count}')
          old_yield = 'if(result==NOKIA_FRONTEND_YIELDED){nokia_frontend_record_yield(pc,3u);goto yielded;}'
          new_yield = 'if(result==NOKIA_FRONTEND_YIELDED){nokia_frontend_record_yield(nokia_frontend_last_pc,3u);goto yielded;}'
          if old_yield not in aot:
              raise SystemExit('chunk yield recorder marker not found')
          aot = aot.replace(old_yield, new_yield, 1)
          aot_path.write_text(aot, encoding='utf-8', newline='\n')
          print('lifecycle failures tagged -3101..-3107')
          print('fast smoke scheduler pump limit: 2000')
          print('AOT per-call label budget: 500000; register/structure capture enabled; labels:', count)

      - name: Build x64 native-only runtime fast
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch 'x64'
          New-Item -ItemType Directory -Force build/native | Out-Null
          $sources = @('build/nokia_runtime_fast.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c','build/merged/nokia_frontend_5320_full.c')
          cl /nologo /I native /O2 /Ob2 /Oi /Ot /Gy /Gw /LD $sources /link /OPT:REF /OPT:ICF "/OUT:build/native/nokia_runtime_5320_x64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'fast native-only runtime link failed' }
          $imports = dumpbin /imports "build/native/nokia_runtime_5320_x64.dll"
          if ($imports -match 'unicorn' -or $imports -match 'python3') {
            throw 'native-only runtime imports Unicorn or Python'
          }

      - name: Smoke test native synthesis
        timeout-minutes: 2
        shell: bash
        run: |
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/smoke-upstream
          cp build/merged/5320-de-male.snapshot build/native/5320-de-male.snapshot
          python tools/smoke_native_5320_runtime.py \
            build/native/nokia_runtime_5320_x64.dll \
            build/smoke-upstream/addon/roms/5320/SYM.ROM \
            build/native/5320-de-male.snapshot \
            build/smoke-upstream/addon/roms/5320/files/system/data

      - name: Upload debug runtime
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-fast-x64
          path: |
            build/native/nokia_runtime_5320_x64.dll
            build/native/5320-de-male.snapshot
          if-no-files-found: warn
