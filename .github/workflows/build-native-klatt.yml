name: Build native Nokia Klatt engine

on:
  workflow_dispatch:
  push:
    paths:
      - "native/generated/**"
      - "native/nokia_klatt_bridge.c"
      - "native/nokia_config_blobs.c"
      - "tools/split_frontend_aot.py"
      - "tools/optimise_frontend_memory.py"
      - "tools/extend_prime_aot.py"
      - "tools/collect_hot_frontend_trace.py"
      - "tools/instrument_frontend_yields.py"
      - "tools/report_frontend_yields.py"
      - "tools/inspect_frontend_addresses.py"
      - "tools/decode_5320_rom_addresses.py"
      - ".github/scripts/enter-msvc.ps1"
      - ".github/workflows/build-native-klatt.yml"

permissions:
  contents: read

jobs:
  prepare-frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect hot 5320 frontend AOT trace
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          curl -L --fail --retry 3 \
            -o build-5320.rom \
            https://raw.githubusercontent.com/djgraco/nokiaKlatt/main/addon/roms/5320/SYM.ROM
          mkdir -p build/native
          python tools/collect_hot_frontend_trace.py \
            build-5320.rom build/native/frontend-hot-trace.json

      - name: Generate expanded 5320 frontend sources
        shell: bash
        run: |
          python tools/extend_prime_aot.py \
            --source native/generated/nokia_frontend_5320.c.gz \
            --trace build/native/frontend-hot-trace.json \
            --rom build-5320.rom \
            --output native/generated/nokia_frontend_5320.c \
            --repair-fallthroughs
          python tools/split_frontend_aot.py native/generated/nokia_frontend_5320.c
          python tools/optimise_frontend_memory.py native/generated/nokia_frontend_5320.c
          python tools/instrument_frontend_yields.py native/generated/nokia_frontend_5320.c

      - name: Inspect 5320 hot yield paths
        shell: bash
        run: |
          python tools/inspect_frontend_addresses.py \
            native/generated/nokia_frontend_5320.c \
            0x827fd6fe 0x52000224 0x801a73d2 0x830f7bce 0x801a3756 0x801ae76a \
            0x830ea2de 0x801a3786 0x801a3736 0x801ae7fa 0x801af2e4 0x827fb74c

      - name: Decode missing 5320 hot paths
        shell: bash
        run: |
          python tools/decode_5320_rom_addresses.py build-5320.rom \
            0x827fd6fa 0x827fd6fc 0x827fd6fe 0x827fd700 \
            0x801a73ce 0x801a73d0 0x801a73d2 0x801a73d4 \
            0x830f7bca 0x830f7bcc 0x830f7bce 0x830f7bd0 \
            0x801a3752 0x801a3754 0x801a3756 0x801a3758 \
            0x801ae766 0x801ae768 0x801ae76a 0x801ae76c

      - name: Report remaining 5320 frontend yield islands
        shell: bash
        run: |
          python tools/report_frontend_yields.py \
            native/generated/nokia_frontend_5320.c \
            --json build/native/frontend-yields.json

      - name: Upload generated frontend sources
        uses: actions/upload-artifact@v6
        with:
          name: nokia-frontend-generated
          path: |
            native/generated/nokia_frontend_5320*.c
            build/native/frontend-yields.json
            build/native/frontend-hot-trace.json
          if-no-files-found: error

  build:
    needs: prepare-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            suffix: x64
          - runner: windows-11-arm
            arch: arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Expand generated Klatt sources
        shell: bash
        run: |
          gzip -dk native/generated/nokia_klatt_*.c.gz

      - name: Download generated 5320 frontend sources
        uses: actions/download-artifact@v7
        with:
          name: nokia-frontend-generated
          path: build/frontend-artifact

      - name: Install generated 5320 frontend sources
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/frontend-artifact -Filter "nokia_frontend_5320*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/ -Force
          }
          $yieldReport = Get-ChildItem -Recurse build/frontend-artifact -Filter "frontend-yields.json" | Select-Object -First 1
          $hotTrace = Get-ChildItem -Recurse build/frontend-artifact -Filter "frontend-hot-trace.json" | Select-Object -First 1
          New-Item -ItemType Directory -Force build/native | Out-Null
          if ($yieldReport) { Copy-Item $yieldReport.FullName "build/native/frontend-yields-${{ matrix.suffix }}.json" -Force }
          if ($hotTrace) { Copy-Item $hotTrace.FullName "build/native/frontend-hot-trace.json" -Force }

      - name: Build profile DLLs
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force build/native | Out-Null
          $profiles = @("5320", "5500", "6650", "6220", "n85")
          foreach ($profile in $profiles) {
            $sources = @("native/generated/nokia_klatt_$profile.c", "native/nokia_klatt_bridge.c")
            if ($profile -eq "5320") {
              $sources += "native/nokia_config_blobs.c"
              $sources += Get-ChildItem native/generated/nokia_frontend_5320*.c | ForEach-Object { $_.FullName }
            } else {
              $sources += "native/nokia_frontend_stub.c"
            }
            cl /nologo /O2 /Gy /LD $sources /link "/OUT:build/native/nokia_klatt_${profile}_${{ matrix.suffix }}.dll"
            if ($LASTEXITCODE -ne 0) { throw "Klatt build failed for $profile" }
          }
          Get-ChildItem build/native/*.dll | ForEach-Object {
            dumpbin /headers $_.FullName | Select-String -Pattern "machine"
          }

      - name: Upload native Klatt DLLs
        uses: actions/upload-artifact@v6
        with:
          name: nokia-klatt-${{ matrix.suffix }}
          path: |
            build/native/nokia_klatt_*_${{ matrix.suffix }}.dll
            build/native/frontend-yields-${{ matrix.suffix }}.json
            build/native/frontend-hot-trace.json
          if-no-files-found: error
