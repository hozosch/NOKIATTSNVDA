name: Build native Nokia Klatt engine

on:
  workflow_dispatch:
  push:
    paths:
      - "native/generated/**"
      - "native/nokia_klatt_bridge.c"
      - "tools/split_frontend_aot.py"
      - "tools/extend_prime_aot.py"
      - "tools/instrument_frontend_yields.py"
      - "tools/report_frontend_yields.py"
      - "tools/inspect_frontend_addresses.py"
      - "tools/decode_5320_rom_addresses.py"
      - ".github/scripts/enter-msvc.ps1"
      - ".github/workflows/build-native-klatt.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            suffix: x64
          - runner: windows-11-arm
            arch: arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Expand generated sources
        shell: bash
        run: |
          gzip -dk native/generated/*.c.gz
          python tools/split_frontend_aot.py native/generated/nokia_frontend_5320.c
          python tools/instrument_frontend_yields.py native/generated/nokia_frontend_5320.c

      - name: Inspect 5320 fault path
        shell: bash
        run: |
          python tools/inspect_frontend_addresses.py \
            native/generated/nokia_frontend_5320.c \
            0x801a0688 0x830e0b6a 0x830e0b6b 0x830e1d96

      - name: Decode missing 5320 AOT gap
        if: matrix.suffix == 'x64'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          curl -L --fail --retry 3 \
            -o build-5320.rom \
            https://raw.githubusercontent.com/djgraco/nokiaKlatt/main/addon/roms/5320/SYM.ROM
          python tools/decode_5320_rom_addresses.py build-5320.rom \
            0x801a0684 0x801a0688 0x801a068c 0x801a0690

      - name: Report remaining 5320 frontend yield islands
        shell: bash
        run: |
          mkdir -p build/native
          python tools/report_frontend_yields.py \
            native/generated/nokia_frontend_5320.c \
            --json build/native/frontend-yields-${{ matrix.suffix }}.json

      - name: Build profile DLLs
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force build/native | Out-Null
          $profiles = @("5320", "5500", "6650", "6220", "n85")
          foreach ($profile in $profiles) {
            $sources = @("native/generated/nokia_klatt_$profile.c", "native/nokia_klatt_bridge.c")
            if ($profile -eq "5320") {
              $sources += "native/generated/nokia_frontend_5320.c"
            } else {
              $sources += "native/nokia_frontend_stub.c"
            }
            cl /nologo /O2 /Gy /LD $sources /link "/OUT:build/native/nokia_klatt_${profile}_${{ matrix.suffix }}.dll"
            if ($LASTEXITCODE -ne 0) { throw "Klatt build failed for $profile" }
          }
          Get-ChildItem build/native/*.dll | ForEach-Object {
            dumpbin /headers $_.FullName | Select-String -Pattern "machine"
          }

      - name: Upload native Klatt DLLs
        uses: actions/upload-artifact@v6
        with:
          name: nokia-klatt-${{ matrix.suffix }}
          path: |
            build/native/nokia_klatt_*_${{ matrix.suffix }}.dll
            build/native/frontend-yields-${{ matrix.suffix }}.json
          if-no-files-found: error
