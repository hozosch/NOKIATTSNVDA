name: Validate local S60 output-only tools

on:
  workflow_dispatch:
  push:
    branches:
      - codex/clean-klatt-test1

permissions:
  contents: read

jobs:
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate independent corpus and measurement tools
        run: |
          python -m unittest tests.test_s60_blackbox_tools
          python -m py_compile \
            tools/capture_s60_blackbox.py \
            tools/analyze_s60_blackbox.py \
            tools/run_s60_blackbox_local.py
