name: Probe known-good 5320 Prime loop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-5320-prime-loop.yml"
      - ".github/scripts/probe_5320_hotspot.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run known-good Unicorn probe
        shell: bash
        run: |
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/upstream
          python .github/scripts/probe_5320_hotspot.py build/upstream --text "Hallo Welt"
