name: Retest Run 38 native-only Nokia 5320

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/patch_5320_zero_veneer.py"
      - ".github/workflows/retest-run38-native-5320.yml"

permissions:
  contents: read

env:
  BASE_RUN: "33374481545"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download Run 38 full AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/run38
          github-token: ${{ github.token }}
          repository: hozosch/NOKIATTSNVDA
          run-id: ${{ env.BASE_RUN }}

      - name: Install generated sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native | Out-Null
          $front = Get-ChildItem -Recurse build/run38 -Filter "nokia_frontend_5320_full*.c"
          if (-not $front) { throw 'Run 38 frontend AOT not found' }
          $snapshot = Get-ChildItem -Recurse build/run38 -Filter "5320-de-male.snapshot" | Select-Object -First 1
          if (-not $snapshot) { throw 'Run 38 snapshot not found' }
          Copy-Item $snapshot.FullName build/native/5320-de-male.snapshot -Force
          $front | ForEach-Object {
            python .github/scripts/patch_5320_zero_veneer.py $_.FullName
          }

      - name: Expand Klatt source
        shell: bash
        run: gzip -dk native/generated/nokia_klatt_5320.c.gz

      - name: Build x64 native-only runtime
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch 'x64'
          $front = Get-ChildItem -Recurse build/run38 -Filter "nokia_frontend_5320_full*.c" | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /O2 /Ob3 /Oi /Ot /Gy /Gw /GL /LD $sources /link /LTCG /OPT:REF /OPT:ICF "/OUT:build/native/nokia_runtime_5320_x64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native-only runtime link failed' }
          $imports = dumpbin /imports "build/native/nokia_runtime_5320_x64.dll"
          if ($imports -match 'unicorn' -or $imports -match 'python3') {
            throw 'native-only runtime imports Unicorn or Python'
          }

      - name: Smoke test native synthesis
        shell: bash
        run: |
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/smoke-upstream
          python tools/smoke_native_5320_runtime.py \
            build/native/nokia_runtime_5320_x64.dll \
            build/smoke-upstream/addon/roms/5320/SYM.ROM \
            build/native/5320-de-male.snapshot \
            build/smoke-upstream/addon/roms/5320/files/system/data

      - name: Upload retested runtime
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-run38-retest-x64
          path: |
            build/native/nokia_runtime_5320_x64.dll
            build/native/5320-de-male.snapshot
          if-no-files-found: warn
