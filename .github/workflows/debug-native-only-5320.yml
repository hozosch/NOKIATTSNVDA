name: Debug native-only Nokia 5320 runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "native/nokia_runtime.c"
      - "native/nokia_runtime.h"
      - "native/nokia_config_blobs.c"
      - "tools/smoke_native_5320_runtime.py"
      - ".github/workflows/debug-native-only-5320.yml"

permissions:
  contents: read

env:
  # This run already contains the statically collected 0x830fae42 DSP helper.
  # Reuse it while iterating on the tiny missing veneer/runtime glue.
  FROZEN_AOT_RUN: "33324006225"

jobs:
  debug-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download latest full AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/full-aot
          github-token: ${{ github.token }}
          repository: hozosch/NOKIATTSNVDA
          run-id: ${{ env.FROZEN_AOT_RUN }}

      - name: Install generated sources and snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/generated/full | Out-Null
          Get-ChildItem -Recurse build/full-aot -Filter "nokia_frontend_5320_full*.c" | ForEach-Object {
            Copy-Item $_.FullName native/generated/full/ -Force
          }
          $snapshot = Get-ChildItem -Recurse build/full-aot -Filter "5320-de-male.snapshot" | Select-Object -First 1
          New-Item -ItemType Directory -Force build/native | Out-Null
          Copy-Item $snapshot.FullName build/native/5320-de-male.snapshot -Force

      - name: Restore missing DSP veneer and diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=next(Path('native/generated/full').glob('nokia_frontend_5320_full*.c'))
          s=p.read_text(encoding='utf-8')

          # The latest frozen corpus already contains the real helper at
          # 0x830fae42. The lifecycle filter still removed this small veneer
          # because it overlaps the specialised Klatt corpus. Restore only the
          # veneer so execution reaches the helper without Unicorn.
          if 'case 0x8310188cu:' not in s:
              anchor='    case 0x830f9db0u: {'
              veneer=('    case 0x8310188cu: {\n'
                      '        uint32_t veneer=(uint32_t)nokia_mem_load(&machine,UINT64_C(0x83101890),4);\n'
                      '        reg_TB=(veneer&1u)!=0; reg_pc=veneer&~1u; goto dispatch;\n'
                      '    }\n')
              if anchor not in s:
                  raise SystemExit('native Klatt dispatcher case not found')
              s=s.replace(anchor,veneer+anchor,1)

          marker='static uint32_t nokia_frontend_last_pc,nokia_frontend_bad_address;'
          if 'nokia_frontend_first_unsupported_pc_value' not in s:
              repl=(marker+'\nstatic uint32_t nokia_frontend_first_unsupported_pc;\n'
                    'NOKIA_EXPORT uint32_t nokia_frontend_first_unsupported_pc_value(void){return nokia_frontend_first_unsupported_pc;}')
              if marker not in s:
                  raise SystemExit('AOT diagnostic marker not found')
              s=s.replace(marker,repl,1)
              target='unsupported:\n    nokia_frontend_bad_address=machine.bad_address;'
              replacement=('unsupported:\n'
                           '    if(!nokia_frontend_first_unsupported_pc) nokia_frontend_first_unsupported_pc=nokia_frontend_last_pc;\n'
                           '    nokia_frontend_bad_address=machine.bad_address;')
              if target not in s:
                  raise SystemExit('AOT unsupported label not found')
              s=s.replace(target,replacement,1)
          p.write_text(s,encoding='utf-8')
          print('helper label present:', 'L_830fae42:' in s)
          print('veneer case present:', 'case 0x8310188cu:' in s)
          PY

      - name: Expand Klatt source
        shell: bash
        run: gzip -dk native/generated/nokia_klatt_5320.c.gz

      - name: Build current native-only runtime
        shell: pwsh
        run: |
          & .github/scripts/enter-msvc.ps1 -Arch 'x64'
          $front = Get-ChildItem native/generated/full/nokia_frontend_5320_full*.c | ForEach-Object { $_.FullName }
          $sources = @('native/nokia_runtime.c','native/nokia_config_blobs.c','native/generated/nokia_klatt_5320.c') + $front
          cl /nologo /O1 /Ob1 /Oi /Gy /Gw /LD $sources /link /OPT:REF /OPT:ICF "/OUT:build/native/nokia_runtime_5320_x64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'native-only runtime link failed' }
          $imports = dumpbin /imports build/native/nokia_runtime_5320_x64.dll
          if ($imports -match 'unicorn' -or $imports -match 'python3') {
            throw 'native-only runtime imports Unicorn or Python'
          }

      - name: Smoke test current runtime
        shell: bash
        run: |
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/smoke-upstream
          python tools/smoke_native_5320_runtime.py \
            build/native/nokia_runtime_5320_x64.dll \
            build/smoke-upstream/addon/roms/5320/SYM.ROM \
            build/native/5320-de-male.snapshot \
            build/smoke-upstream/addon/roms/5320/files/system/data

      - name: Upload debug runtime
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nokia-runtime-5320-debug-x64
          path: |
            build/native/nokia_runtime_5320_x64.dll
            build/native/5320-de-male.snapshot
          if-no-files-found: warn
