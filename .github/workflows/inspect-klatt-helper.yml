name: Inspect native Klatt helper
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-klatt-helper.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show helper and dispatcher
        shell: bash
        run: |
          gzip -dc native/generated/nokia_klatt_5320.c.gz > /tmp/klatt.c
          grep -n -B 20 -A 30 'goto helper_idiv' /tmp/klatt.c || true
          grep -n -B 20 -A 30 'goto helper_udivmod' /tmp/klatt.c || true
          grep -n -B 10 -A 40 '^dispatch:' /tmp/klatt.c || true
          grep -n -B 10 -A 25 'L_8310182c:' /tmp/klatt.c || true
          grep -n -B 10 -A 25 'L_83101854:' /tmp/klatt.c || true
          grep -n -B 10 -A 25 'L_8310188c:' /tmp/klatt.c || true
