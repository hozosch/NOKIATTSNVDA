name: Inspect native Klatt helper
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-klatt-helper.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show helper and dispatcher
        shell: bash
        run: |
          gzip -dc native/generated/nokia_klatt_5320.c.gz > /tmp/klatt.c
          grep -n -B 20 -A 120 'L_830fae42:' /tmp/klatt.c || true
          grep -n -B 8 -A 12 'goto L_830fae42' /tmp/klatt.c || true
          grep -n -B 4 -A 8 'case 0x830fae42u' /tmp/klatt.c || true
