name: Inspect native Klatt helper
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-klatt-helper.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode helper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/upstream
          cp build/upstream/addon/roms/5320/SYM.ROM build-5320.rom
          python tools/decode_5320_rom_addresses.py build-5320.rom \
            0x830fbfa0 0x830fbfa4 0x830fbfa8 0x830fbfac \
            0x830fbfb0 0x830fbfb4 0x830fbfb8 0x830fbfbc \
            0x830fbfc0 0x830fbfc4 0x830fbfc8 0x830fbfcc \
            0x830fbfd0 0x830fbfd4 0x830fbfd8 0x830fbfdc \
            0x830fbfe0 0x830fbfe4 0x830fbfe8 0x830fbfec \
            0x830fbff0 0x830fbff4 0x830fbff8 0x830fbffc
