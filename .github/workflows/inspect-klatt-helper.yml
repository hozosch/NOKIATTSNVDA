name: Inspect native Klatt helper
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-klatt-helper.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode helper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/upstream
          cp build/upstream/addon/roms/5320/SYM.ROM build-5320.rom
          python tools/decode_5320_rom_addresses.py build-5320.rom \
            0x8310182c 0x83101830 0x83101854 0x83101858 0x8310188c 0x83101890 \
            0x830fae38 0x830fae3a 0x830fae3c 0x830fae3e 0x830fae40 \
            0x830fae42 0x830fae44 0x830fae46 0x830fae48 0x830fae4a \
            0x830fae4c 0x830fae4e 0x830fae50 0x830fae52 0x830fae54
