name: Inspect native Klatt helper
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-klatt-helper.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode helper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          git clone --depth 1 https://github.com/djgraco/nokiaKlatt.git build/upstream
          cp build/upstream/addon/roms/5320/SYM.ROM build-5320.rom
          python tools/decode_5320_rom_addresses.py build-5320.rom \
            0x830f9d50 0x830f9d54 0x830f9d58 0x830f9d5c \
            0x830f9d60 0x830f9d64 0x830f9d68 0x830f9d6c \
            0x830f9d70 0x830f9d74 0x830f9d78 0x830f9d7c \
            0x830f9d80 0x830f9d84 0x830f9d88 0x830f9d8c \
            0x830f9d90 0x830f9d94 0x830f9d98 0x830f9d9c \
            0x830f9da0 0x830f9da4 0x830f9da8 0x830f9dac 0x830f9db0
