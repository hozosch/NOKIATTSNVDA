name: Diagnose Nokia 5320 DSP AOT gap

on:
  push:
    paths:
      - ".github/workflows/diagnose-5320-dsp-gap.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Run 50 full AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/run50-aot
          repository: hozosch/NOKIATTSNVDA
          run-id: 33574474293
          github-token: ${{ github.token }}

      - name: Download frozen Test 18 firmware
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Diagnose stage 8 indirect DSP target
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import pypcode

          sys.path.insert(0,str(Path.cwd()))
          from tools.collect_5320_dsp_wrapper_trace import (
              ROM_BASE,instruction_size,translate,
          )

          root=Path('build/run50-aot')
          rom=Path('build/test18-addon/data/SYM.ROM').read_bytes()
          targets=(
              0x80196ffc,0x801a1344,
              0x830ff946,0x830ff948,0x830ff94a,
              0x830ff968,0x830ff96a,
          )

          print('=== TRACE MEMBERSHIP ===')
          for path in sorted(root.rglob('*.json')):
              try:
                  payload=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              by_address={
                  int(item['address']):item
                  for item in payload.get('instructions',[])
              }
              hits={
                  f'0x{address:08x}':by_address.get(address)
                  for address in targets
              }
              if any(value is not None for value in hits.values()):
                  print(path,'count=',len(by_address),'hits=',hits)
                  nearby=[
                      item for item in payload.get('instructions',[])
                      if 0x830ff920 <= int(item['address']) <= 0x830ff990
                  ]
                  if nearby:
                      print('DSP nearby=',nearby)

          print('=== GENERATED C MEMBERSHIP ===')
          for path in sorted(root.rglob('nokia_frontend_5320_full*.c')):
              lines=path.read_text(encoding='utf-8').splitlines()
              for address in targets:
                  label=f'L_{address:08x}:'
                  indices=[i for i,line in enumerate(lines) if line==label]
                  if indices:
                      at=indices[0]
                      print(path,label,'line',at+1)
                      print('\n'.join(
                          f'{n+1}: {lines[n]}'
                          for n in range(
                              max(0,at-3),min(len(lines),at+25)
                          )
                      ))

          def disassemble(start,end,thumb):
              print(
                  f'=== DISASSEMBLY 0x{start:08x}-0x{end:08x} '
                  f'thumb={thumb} ==='
              )
              context=pypcode.Context(
                  'ARM:LE:32:v8T' if thumb else 'ARM:LE:32:v8'
              )
              result=context.disassemble(
                  rom[start-ROM_BASE:end-ROM_BASE],
                  base_address=start,
                  max_instructions=256,
              )
              for instruction in result.instructions:
                  address=instruction.addr.offset
                  raw=rom[
                      address-ROM_BASE:
                      address-ROM_BASE+instruction.length
                  ].hex()
                  print(
                      f'0x{address:08x} {raw:8s} '
                      f'{instruction.mnem:8s} {instruction.body}'
                  )

          disassemble(0x830ff920,0x830ff990,True)
          disassemble(0x80196fe0,0x80197020,True)
          disassemble(0x801a1320,0x801a1360,True)

          print('=== PCODE CONTROL OPERATIONS ===')
          for address in targets:
              for thumb in (True,False):
                  try:
                      ops,size=translate(rom,address,thumb)
                  except Exception as error:
                      print(
                          f'0x{address:08x} thumb={thumb} '
                          f'{type(error).__name__}: {error}'
                      )
                      continue
                  controls=[
                      str(op) for op in ops
                      if op.opcode.name in (
                          'BRANCH','CBRANCH','CALL',
                          'BRANCHIND','CALLIND','RETURN'
                      )
                  ]
                  print(
                      f'0x{address:08x} thumb={thumb} '
                      f'size={size} controls={controls}'
                  )

          print('=== ROM POINTER REFERENCES ===')
          for value in (
              0x830ff968,0x830ff969,0x830ff96a,0x830ff96b,
              0x830ff946,0x830ff947,
          ):
              needle=value.to_bytes(4,'little')
              offsets=[]
              start=0
              while True:
                  at=rom.find(needle,start)
                  if at<0:
                      break
                  offsets.append(ROM_BASE+at)
                  start=at+1
              print(
                  f'0x{value:08x}:',
                  [f'0x{x:08x}' for x in offsets],
              )
          PY
