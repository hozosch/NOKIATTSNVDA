name: Diagnose Nokia 5320 DSP AOT gap

on:
  push:
    paths:
      - ".github/workflows/diagnose-5320-dsp-gap.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Run 48 full AOT
        uses: actions/download-artifact@v7
        with:
          name: nokia-5320-full-aot
          path: build/run48-aot
          repository: hozosch/NOKIATTSNVDA
          run-id: 33559334900
          github-token: ${{ github.token }}

      - name: Download frozen Test 18 firmware
        uses: actions/download-artifact@v7
        with:
          name: nokiaNative5320-0.1.0-test18
          path: build/test18-package
          repository: hozosch/NOKIATTSNVDA
          run-id: 33459286021
          github-token: ${{ github.token }}

      - name: Measure full known DSP frontier
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypcode
          addon=$(find build/test18-package -name '*.nvda-addon' -print -quit)
          test -n "$addon"
          unzip -q "$addon" -d build/test18-addon
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          import tools.collect_5320_dsp_wrapper_trace as dsp

          dsp.MAX_INSTRUCTIONS=32768
          root=Path('build/run48-aot')
          rom=Path('build/test18-addon/data/SYM.ROM').read_bytes()
          payload=json.loads(
              (root/'build/native/native-lifecycle-trace.json').read_text(
                  encoding='utf-8'
              )
          )
          known=set()
          known_sizes={}
          for item in payload.get('instructions',[]):
              raw=int(item['address'])
              key=(
                  raw & ~1,
                  bool(item.get('thumb',False)) or bool(raw & 1),
              )
              known.add(key)
              known_sizes[key]=int(item['size'])
          frontier=sorted(
              key for key,size in known_sizes.items()
              if (
                  dsp.allowed(key[0])
                  and dsp.allowed(key[0]+size)
                  and (key[0]+size,key[1]) not in known
              )
          )
          result={}
          depths={}
          terminals=set()
          errors=[]
          for address,thumb in frontier:
              try:
                  dsp.collect(
                      rom,address,thumb,0,result,depths,terminals,known
                  )
              except Exception as error:
                  match=re.search(r'r0x([0-9a-fA-F]+)',str(error))
                  failed=(
                      int(match.group(1),16) if match else address
                  )
                  errors.append((failed,thumb,type(error).__name__,str(error)))
          addresses=sorted(address for address,_thumb in result)
          resolved={address for address,_thumb in known}
          resolved.update(addresses)
          unresolved=sorted(
              address for address in terminals
              if dsp.allowed(address) and address not in resolved
          )
          print('known DSP boundary candidates:',len(frontier))
          print('new frontier instructions:',len(result))
          print('frontier result range:',(
              f'0x{addresses[0]:08x}-0x{addresses[-1]:08x}'
              if addresses else 'empty'
          ))
          print('0x830fc506 added:',
                any(address==0x830fc506 for address,_thumb in result))
          print('decode errors:',len(errors))
          for item in errors:
              print(
                  f'  0x{item[0]:08x} thumb={item[1]} '
                  f'{item[2]}: {item[3]}'
              )
          print('unresolved allowed terminals:',
                [f'0x{x:08x}' for x in unresolved])
          print('first additions:',
                [f'0x{x:08x}' for x in addresses[:80]])
          print('last additions:',
                [f'0x{x:08x}' for x in addresses[-80:]])
          if not any(address==0x830fc506 for address,_thumb in result):
              raise SystemExit('failed continuation was not closed')
          if unresolved:
              raise SystemExit('frontier has unresolved allowed terminals')
          PY
